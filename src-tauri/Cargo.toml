[package]
name = "app"
version = "1.1.0"
description = "A lightweight desktop widget that displays your GitHub contribution graph"
authors = ["Arindam Jaiman"]
license = "MIT"
repository = "https://github.com/ArindamJaiman/Github-Contribution-graph-windows-widget"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3", features = ["tray-icon"] }
chrono = "0.4.44"
regex = "1.12.3"
# Single TLS stack (native: SChannel on Windows) + gzip; avoids compiling rustls/ring alongside it.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy", "gzip"] }
tokio = { version = "1", features = ["time", "sync"] }
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Small, fast release binary for an always-running widget.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
